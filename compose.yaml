services:
  postgres:
    image: postgres:18
    container_name: delivery-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: delivery_db

    volumes:
      - delivery_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: delivery-etl

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: delivery_db
      DB_USER: postgres
      DB_PASSWORD: root

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app

volumes:
  delivery_postgres_data:
    external: true